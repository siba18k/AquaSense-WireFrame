<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AquaSense - Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-on-surface": "#eff0fa",
                    "tertiary-container": "#df3429",
                    "on-tertiary-container": "#ffffff",
                    "on-tertiary-fixed": "#410001",
                    "surface": "#f9f9ff",
                    "surface-container": "#ecedf7",
                    "on-error-container": "#93000a",
                    "primary-container": "#1a73e8",
                    "secondary-fixed-dim": "#afc7fb",
                    "on-primary-container": "#ffffff",
                    "on-surface": "#191c23",
                    "inverse-primary": "#adc7ff",
                    "surface-bright": "#f9f9ff",
                    "surface-container-high": "#e6e8f2",
                    "error": "#ba1a1a",
                    "on-tertiary-fixed-variant": "#930004",
                    "outline": "#727785",
                    "on-primary-fixed": "#001a41",
                    "on-surface-variant": "#414754",
                    "on-primary-fixed-variant": "#004493",
                    "tertiary-fixed": "#ffdad5",
                    "on-tertiary": "#ffffff",
                    "surface-container-highest": "#e0e2ec",
                    "outline-variant": "#c1c6d6",
                    "secondary": "#475e8c",
                    "primary": "#005bbf",
                    "on-primary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "secondary-fixed": "#d8e2ff",
                    "error-container": "#ffdad6",
                    "primary-fixed-dim": "#adc7ff",
                    "secondary-container": "#b2c9fe",
                    "surface-container-low": "#f2f3fd",
                    "on-secondary": "#ffffff",
                    "on-background": "#191c23",
                    "on-error": "#ffffff",
                    "on-secondary-container": "#3d5481",
                    "surface-tint": "#005bc0",
                    "inverse-surface": "#2d3038",
                    "primary-fixed": "#d8e2ff",
                    "background": "#f9f9ff",
                    "on-secondary-fixed": "#001a41",
                    "on-secondary-fixed-variant": "#2e4673",
                    "tertiary": "#bb1712",
                    "tertiary-fixed-dim": "#ffb4a9",
                    "surface-variant": "#e0e2ec",
                    "surface-dim": "#d8d9e3"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9ff;
        }
        h1, h2, h3, .data-display {
            font-family: 'Space Grotesk', sans-serif;
        }
        .glass-effect {
            backdrop-filter: blur(24px);
            background-color: rgba(255, 255, 255, 0.7);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-6">
<!-- Brand Identity Logo Area -->
<div class="mb-12 flex flex-col items-center">
<div class="w-16 h-16 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center mb-4 shadow-[0px_0px_32px_rgba(0,91,191,0.15)]">
<span class="material-symbols-outlined text-white text-3xl" data-icon="water_drop">water_drop</span>
</div>
<h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-primary to-primary-container bg-clip-text text-transparent">
            AquaSense
        </h1>
<p class="text-outline font-body text-sm mt-1">Water Quality Intelligence</p>
</div>
<!-- Login Container -->
<main class="w-full max-w-md">
<div class="bg-surface-container-lowest rounded-xl p-8 md:p-10 shadow-[0px_0px_48px_rgba(25,28,35,0.04)]">
<header class="mb-8">
<h2 class="text-2xl font-bold text-on-surface tracking-tight mb-2">Welcome Back</h2>
<p class="text-outline text-sm">Please enter your credentials to access the laboratory dashboard.</p>
</header>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant px-1" for="email">
                        Email Address
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="mail">mail</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all outline-none" id="email" name="email" placeholder="scientist@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end px-1">
<label class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant" for="password">
                            Password
                        </label>
<a class="text-xs font-medium text-primary hover:text-primary-container transition-colors" href="#">Forgot?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-outline hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-white font-semibold py-4 rounded-full shadow-[0px_8px_16px_rgba(0,91,191,0.2)] hover:shadow-[0px_12px_24px_rgba(0,91,191,0.3)] active:scale-95 transition-all duration-200" type="submit">
                        Login to Dashboard
                    </button>
</div>
</form>
<!-- Secondary Action -->
<footer class="mt-8 text-center">
<p class="text-on-surface-variant text-sm">
                    New to AquaSense? 
                    <a class="text-primary font-semibold hover:text-primary-container transition-colors ml-1" href="#">Create account</a>
</p>
</footer>
</div>
<!-- System Status Mini-Card (Contextual Detail) -->
<div class="mt-8 flex items-center justify-center gap-4 py-3 px-6 bg-surface-container-low rounded-full">
<div class="flex items-center gap-2">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>
<span class="text-[10px] font-bold uppercase tracking-widest text-outline">System Online</span>
</div>
<div class="h-4 w-[1px] bg-outline-variant/30"></div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-sm text-outline" data-icon="verified_user">verified_user</span>
<span class="text-[10px] font-bold uppercase tracking-widest text-outline">Secure Gateway</span>
</div>
</div>
</main>
<!-- Decorative Elements (Asymmetric Fluidity) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute bottom-1/4 -right-24 w-64 h-64 bg-primary-container/10 rounded-full blur-3xl"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full opacity-5 bg-[radial-gradient(#005bbf_1px,transparent_1px)] [background-size:32px_32px]"></div>
</div>
</body></html>
